[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shorts-agent"
version = "0.1.0"
description = "Rights-aware workflow for preparing YouTube Shorts from authorized media"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]
dashboard = ["streamlit>=1.42", "python-dotenv>=1.0"]

[project.scripts]
shorts-agent = "shorts_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"